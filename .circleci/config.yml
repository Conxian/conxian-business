# Conxian Protocol CI — CircleCI
# Heavy compute jobs moved from GitHub Actions to reduce billing.
# Lightweight checks (secret-scan, dep-review, docs-validate) remain on Actions.
version: 2.1

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.96.0
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

  node-executor:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium

  clarity-executor:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium

commands:
  checkout-submodules:
    description: "Checkout repo with submodules"
    steps:
      - checkout
      - run:
          name: Initialize submodules
          command: git submodule update --init --recursive

  rust-cache:
    description: "Cache Rust dependencies for a submodule workspace"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - restore_cache:
          keys:
            - rust-cache-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/Cargo.lock" }}
            - rust-cache-{{ arch }}-
      - run:
          name: Fetch Rust dependencies
          command: cd << parameters.workspace_path >> && cargo fetch
      - save_cache:
          key: rust-cache-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

  rust-test:
    description: "Run cargo check + test"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - run:
          name: Cargo check (<< parameters.workspace_path >>)
          command: cd << parameters.workspace_path >> && cargo check --workspace --locked
      - run:
          name: Cargo test (<< parameters.workspace_path >>)
          command: cd << parameters.workspace_path >> && cargo test --workspace --locked

  node-install:
    description: "Install Node.js dependencies"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@latest
      - restore_cache:
          keys:
            - pnpm-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/pnpm-lock.yaml" }}
            - pnpm-{{ arch }}-
      - run:
          name: Install dependencies
          command: cd << parameters.workspace_path >> && pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/pnpm-lock.yaml" }}
          paths:
            - << parameters.workspace_path >>/node_modules
            - ~/.local/share/pnpm

jobs:
  # ── Clarity Contracts (Conxian/Conxian) ──
  clarity-check:
    executor: clarity-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "Conxian"
      - run:
          name: Clarity chain-check
          command: cd Conxian && npx clarinet check
      - run:
          name: Protocol tests
          command: cd Conxian && bash scripts/run-tests.sh

  # ── Gateway (Rust) ──
  gateway-test:
    executor: rust-executor
    resource_class: large
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxian-gateway"

  # ── Nexus (Rust) ──
  nexus-test:
    executor: rust-executor
    resource_class: large
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxian-nexus"

  # ── Core Library (Rust) ──
  core-test:
    executor: rust-executor
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "lib-conxian-core"
      - run:
          name: Cargo audit
          command: |
            cargo install cargo-audit --locked
            cd lib-conxian-core && cargo audit

  # ── Enclave SDK (Rust) ──
  enclave-sdk-test:
    executor: rust-executor
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxius-enclave-sdk"

  # ── Wallet (TypeScript/Android) ──
  wallet-test:
    executor: node-executor
    resource_class: large
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxius-wallet"
      - run:
          name: Wallet tests
          command: cd conxius-wallet && pnpm test

  # ── Platform (TypeScript) ──
  platform-test:
    executor: node-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxius-platform"
      - run:
          name: Platform tests
          command: cd conxius-platform && pnpm test

  # ── UI (Next.js) ──
  ui-test:
    executor: node-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxian-ui"
      - run:
          name: UI build check
          command: cd conxian-ui && pnpm build

# ── Workflows ──
workflows:
  version: 2
  protocol-ci:
    jobs:
      - clarity-check
      - gateway-test
      - nexus-test
      - core-test
      - enclave-sdk-test
      - wallet-test
      - platform-test
      - ui-test