# Conxian Protocol CI — CircleCI
# Heavy compute jobs moved from GitHub Actions to reduce billing.
# GitHub Actions is experiencing a runner provisioning outage (all file-based
# workflows fail with steps:[]). CircleCI handles the complete CI surface.
version: 2.1

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.96.0
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

  node-executor:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium

  python-executor:
    docker:
      - image: cimg/python:3.11
    resource_class: small

  clarity-executor:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium

commands:
  checkout-submodules:
    description: "Checkout repo with public submodules (conxian-market is private)"
    steps:
      - checkout
      - run:
          name: Initialize public submodules
          command: |
            git submodule sync --recursive
            for sub in Conxian conxian-gateway conxian-labs-site conxian-nexus \
                       conxian-ui conxius-enclave-sdk conxius-orbit conxius-platform \
                       conxius-wallet lib-conxian-core; do
              git submodule update --init --depth 1 "$sub"
            done
            git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform

  rust-cache:
    description: "Cache Rust dependencies for a submodule workspace"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - restore_cache:
          keys:
            - rust-cache-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/Cargo.lock" }}
            - rust-cache-{{ arch }}-
      - run:
          name: Fetch Rust dependencies
          command: cd << parameters.workspace_path >> && cargo fetch
      - save_cache:
          key: rust-cache-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

  rust-test:
    description: "Run cargo check + test"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - run:
          name: Cargo check (<< parameters.workspace_path >>)
          command: cd << parameters.workspace_path >> && cargo check --workspace --locked
      - run:
          name: Cargo test (<< parameters.workspace_path >>)
          command: cd << parameters.workspace_path >> && cargo test --workspace --locked

  node-install:
    description: "Install Node.js dependencies"
    parameters:
      workspace_path:
        type: string
        default: "."
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - restore_cache:
          keys:
            - pnpm-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/pnpm-lock.yaml" }}
            - pnpm-{{ arch }}-
      - run:
          name: Install dependencies
          command: cd << parameters.workspace_path >> && pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-{{ arch }}-{{ checksum "<< parameters.workspace_path >>/pnpm-lock.yaml" }}
          paths:
            - << parameters.workspace_path >>/node_modules
            - ~/.local/share/pnpm

jobs:
  # ── Security Scan (gitleaks) ──
  gitleaks:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Run gitleaks detect
          command: |
            VERSION="8.24.2"
            ARCH="$(uname -m)"
            case "$ARCH" in x86_64|amd64) TA="x64" ;; aarch64|arm64) TA="arm64" ;; *) echo "unsupported arch"; exit 1 ;; esac
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${TA}.tar.gz" | tar -xz gitleaks
            chmod +x gitleaks
            ./gitleaks detect --source . --redact --no-git --config .gitleaks.toml --verbose

  # ── Repo Hygiene (Python scripts) ──
  repo-hygiene:
    executor: python-executor
    resource_class: medium
    steps:
      - checkout-submodules
      - run:
          name: Install Python deps
          command: pip install --disable-pip-version-check packaging
      - run:
          name: Verify knowledge retention (ZSE)
          command: python3 scripts/verify_knowledge_retention.py
      - run:
          name: Verify submodule integrity
          command: python3 scripts/verify_submodule_integrity.py
      - run:
          name: Verify doctrine alignment
          command: python3 scripts/verify_doctrine_alignment.py
      - run:
          name: Verify LTS compliance
          command: python3 scripts/verify_lts_compliance.py
      - run:
          name: Verify release hygiene
          command: python3 scripts/verify_release_hygiene.py
      - run:
          name: Verify contamination guard
          command: python3 scripts/verify_contamination_guard.py
      - run:
          name: Verify BOS production boundary
          command: python3 scripts/verify_bos_production_boundary.py

  # ── Root pnpm audit ──
  root-audit:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - run:
          name: Audit root dependencies
          command: pnpm audit || true
      - run:
          name: Verify lockfile is up-to-date
          command: pnpm install --frozen-lockfile

  # ── Clarity Contracts (Conxian/Conxian) ──
  clarity-check:
    executor: clarity-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "Conxian"
      - run:
          name: Clarity chain-check
          command: cd Conxian && npx clarinet check
      - run:
          name: Protocol tests
          command: cd Conxian && bash scripts/run-tests.sh

  # ── Gateway (Rust) ──
  gateway-test:
    executor: rust-executor
    resource_class: large
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxian-gateway"

  # ── Nexus (Rust) ──
  nexus-test:
    executor: rust-executor
    resource_class: large
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxian-nexus"

  # ── Core Library (Rust) ──
  core-test:
    executor: rust-executor
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "lib-conxian-core"
      - run:
          name: Cargo audit
          command: |
            cargo install cargo-audit --locked
            cd lib-conxian-core && cargo audit

  # ── Enclave SDK (Rust) ──
  enclave-sdk-test:
    executor: rust-executor
    steps:
      - checkout-submodules
      - rust-cache
      - rust-test:
          workspace_path: "conxius-enclave-sdk"

  # ── Wallet (TypeScript/Android) ──
  wallet-test:
    executor: node-executor
    resource_class: large
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxius-wallet"
      - run:
          name: Wallet tests
          command: cd conxius-wallet && pnpm test

  # ── Platform (TypeScript) ──
  platform-test:
    executor: node-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxius-platform"
      - run:
          name: Platform tests
          command: cd conxius-platform && pnpm test

  # ── Orbit (Python) ──
  orbit-test:
    executor: python-executor
    steps:
      - checkout-submodules
      - run:
          name: Orbit validation
          command: |
            pip install -r conxius-orbit/requirements.txt
            python3 conxius-orbit/conxian_testnet_deploy.py --help

  # ── Labs Site (TypeScript) ──
  labs-site-test:
    executor: node-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxian-labs-site"
      - run:
          name: Labs site build check
          command: cd conxian-labs-site && pnpm build

  # ── UI (Next.js) ──
  ui-test:
    executor: node-executor
    steps:
      - checkout-submodules
      - node-install:
          workspace_path: "conxian-ui"
      - run:
          name: UI build check
          command: cd conxian-ui && pnpm build

# ── Workflows ──
workflows:
  version: 2
  protocol-ci:
    jobs:
      - gitleaks
      - repo-hygiene
      - root-audit
      - clarity-check
      - gateway-test
      - nexus-test
      - core-test
      - enclave-sdk-test
      - wallet-test
      - platform-test
      - orbit-test
      - labs-site-test
      - ui-test