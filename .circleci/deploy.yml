# Conxian Deploy Pipeline — CircleCI
# GCP Cloud Run, Firebase, and Vercel deployments.
version: 2.1

orbs:
  gcp-gcr: circleci/gcp-gcr@0.16.0
  gcp-cloud-run: circleci/gcp-cloud-run@1.0.2

executors:
  deploy-executor:
    docker:
      - image: cimg/base:current
    resource_class: medium

  node-executor:
    docker:
      - image: cimg/node:22.19.0
    resource_class: medium

jobs:
  # ── Gateway → GCP Cloud Run ──
  gateway-cloud-run:
    executor: deploy-executor
    steps:
      - run:
          name: Clone repository
          command: |
            git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .
            git config user.email "circleci@conxian.io"
            git config user.name "CircleCI"
      - run:
          name: Initialize submodules
          command: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/" && git submodule sync --recursive && for sub in Conxian conxian-gateway conxian-labs-site conxian-nexus conxian-ui conxius-enclave-sdk conxius-orbit conxius-platform conxius-wallet lib-conxian-core; do git submodule update --init --depth 1 "$sub"; done && git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform
      - run:
          name: Authenticate with GCP
          command: |
            echo "${GCP_SA_KEY}" > /tmp/gcp-key.json
            gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
            gcloud config set project "${GCP_PROJECT_ID}"
            gcloud auth configure-docker gcr.io --quiet
      - run:
          name: Build and push Docker image
          command: |
            IMAGE="gcr.io/${GCP_PROJECT_ID}/conxian-gateway:${CIRCLE_SHA1}"
            cd conxian-gateway
            docker build -t "${IMAGE}" .
            docker push "${IMAGE}"
            echo "export GATEWAY_IMAGE=${IMAGE}" >> "$BASH_ENV"
      - run:
          name: Deploy to Cloud Run
          command: |
            gcloud run deploy conxian-gateway \
              --image="${GATEWAY_IMAGE}" \
              --region=us-central1 \
              --memory=512Mi \
              --cpu=1 \
              --min-instances=0 \
              --max-instances=2 \
              --no-allow-unauthenticated \
              --platform=managed
      - run:
          name: Update release marker
          command: |
            circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Update release marker (failed)
          command: |
            circleci run release update --status=FAILED
          when: on_fail

  # ── Showcase DApp → Firebase ──
  firebase-deploy:
    executor: node-executor
    steps:
      - run:
          name: Clone repository
          command: |
            git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .
            git config user.email "circleci@conxian.io"
            git config user.name "CircleCI"
      - run:
          name: Initialize submodules
          command: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/" && git submodule sync --recursive && for sub in Conxian conxian-gateway conxian-labs-site conxian-nexus conxian-ui conxius-enclave-sdk conxius-orbit conxius-platform conxius-wallet lib-conxian-core; do git submodule update --init --depth 1 "$sub"; done && git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform
      - run:
          name: Install Firebase CLI
          command: sudo npm install -g firebase-tools
      - run:
          name: Build and deploy showcase-dapp
          command: |
            cd showcase-dapp
            npm install
            npm run build
            npx firebase deploy --only hosting --token "${FIREBASE_TOKEN}"

  # ── Docs → Vercel ──
  vercel-deploy:
    executor: node-executor
    steps:
      - run:
          name: Clone repository
          command: |
            git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git .
            git config user.email "circleci@conxian.io"
            git config user.name "CircleCI"
      - run:
          name: Initialize submodules
          command: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/" && git submodule sync --recursive && for sub in Conxian conxian-gateway conxian-labs-site conxian-nexus conxian-ui conxius-enclave-sdk conxius-orbit conxius-platform conxius-wallet lib-conxian-core; do git submodule update --init --depth 1 "$sub"; done && git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform
      - run:
          name: Install Vercel CLI
          command: sudo npm install -g vercel
      - run:
          name: Deploy docs to Vercel
          command: |
            cd docs
            npx vercel deploy --prod --token="${VERCEL_TOKEN}" --yes

  cancel-deploy:
    executor: deploy-executor
    steps:
      - run:
          name: Update release to CANCELED
          command: circleci run release update --status=CANCELED

workflows:
  version: 2
  deploy:
    jobs:
      - gateway-cloud-run:
          filters:
            branches:
              only: main
      - firebase-deploy:
          filters:
            branches:
              only: main
      - vercel-deploy:
          filters:
            branches:
              only: main
      - cancel-deploy:
          filters:
            branches:
              only: main
