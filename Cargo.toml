[workspace]
# Intentionally exclude `conxian-gateway` and `lib-conxian-core` here: they are their own
# workspace roots, and listing them as members causes nested-workspace conflicts that
# break `cargo` invocations under Unified CI (B2B Suite + Core Library Suite).
members = [
    "conxian-nexus",
    "conxius-enclave-sdk",
]
resolver = "2"
