# gitleaks config — tuned for Conxian monorepo
# https://github.com/gitleaks/gitleaks#configuration

title = "Conxian gitleaks config"

[allowlist]
description = "Global allowlist"

# W3C DID:key identifiers use did:key: prefix followed by a multibase-encoded public key.
# These are public-key anchors (not secrets) but trigger generic-api-key heuristics.
regexes = [
  '''did:key:z[a-zA-Z0-9]+''',
]

# Files and directories that never contain secrets
paths = [
  '''\.gitleaks\.toml''',
  '''ecosystem-dashboard\.md''',
  '''dependabot-fixes\.md''',
  # Submodule content may contain test fixtures, sample keys, and docs
  # that trigger false positives. These are not production secrets.
  '''Conxian/contracts/.*''',
  '''conxian-gateway/docs/.*\.md''',
  '''conxian-gateway/\.env\.example''',
  '''conxian-nexus/docs/.*''',
  '''conxian-nexus/tests/.*''',
  '''conxius-enclave-sdk/tests/.*''',
  '''conxius-enclave-sdk/docs/.*''',
  '''conxius-wallet/docs/.*''',
  '''conxius-wallet/test/.*''',
  '''conxius-platform/docs/.*''',
  '''conxius-orbit/docs/.*''',
  '''lib-conxian-core/docs/.*''',
  '''lib-conxian-core/enclave-poc/.*''',
  '''lib-conxian-core/scripts/tests/.*''',
  '''lib-conxian-core/tests/.*''',
  # pnpm-lock.yaml and Cargo.lock contain checksums, not secrets
  '''pnpm-lock\.yaml''',
  '''Cargo\.lock''',
  # CI workflow files reference action SHAs, not secrets
  '''\.github/workflows/.*\.yml''',
  # Governance scripts with embedded test data
  '''scripts/.*\.py''',
  '''scripts/tests/.*\.py''',
  '''tests/.*\.py''',
  '''\.gitleaksignore''',
]
