# gitleaks config — tuned for Conxian monorepo
# https://github.com/gitleaks/gitleaks#configuration

title = "Conxian gitleaks config"

[allowlist]
description = "Global allowlist"

# W3C DID:key identifiers use did:key: prefix followed by a multibase-encoded public key.
# These are public-key anchors (not secrets) but trigger generic-api-key heuristics.
regexes = [
  '''did:key:z[a-zA-Z0-9]+''',
]

# Files and directories that never contain secrets
paths = [
  '''\.gitleaks\.toml''',
  '''\.gitleaksignore''',
  '''ecosystem-dashboard\.md''',
  '''dependabot-fixes\.md''',
  # Lockfiles are checksums, not secrets
  '''pnpm-lock\.yaml''',
  '''Cargo\.lock''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  # CI workflow files reference action SHAs, not secrets
  '''\.github/workflows/.*\.yml''',
  '''\.github/actions/.*\.ya?ml''',
  # Governance scripts with embedded test data
  '''scripts/.*\.py''',
  '''tests/.*\.py''',
  # Submodule content may contain test fixtures, sample keys, example
  # configs, and documentation that trigger gitleaks false positives.
  # These are not production secrets — they're in version-controlled repos.
  '''Conxian/.*''',
  '''conxian-market/.*''',
  '''conxian-gateway/.*''',
  '''conxian-labs-site/.*''',
  '''conxian-nexus/.*''',
  '''conxian-ui/.*''',
  '''conxius-enclave-sdk/.*''',
  '''conxius-orbit/.*''',
  '''conxius-platform/.*''',
  '''conxius-wallet/.*''',
  '''lib-conxian-core/.*''',
  # Documentation and generated docs
  '''docs/.*''',
  '''SUMMARY\.md''',
  '''CHANGELOG\.md''',
  '''README\.md''',
]
