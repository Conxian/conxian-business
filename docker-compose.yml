version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${DB_NAME:-nexus}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - conxian-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - conxian-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus:
    build:
      context: ./conxian-nexus
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_dev_password}@db:5432/${DB_NAME:-nexus}
      REDIS_URL: redis://redis:6379/
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-https://api.mainnet.hiro.so}
      REST_PORT: '3000'
      GRPC_PORT: '50051'
      RUST_LOG: ${NEXUS_RUST_LOG:-info}
      NEXUS_ORACLE_ENABLED: ${NEXUS_ORACLE_ENABLED:-0}
      NEXUS_ORACLE_STUB_OK: ${NEXUS_ORACLE_STUB_OK:-0}
      NEXUS_EXPERIMENTAL_APIS: ${NEXUS_EXPERIMENTAL_APIS:-0}
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      API_PORT: '3000'
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-https://bitcoin-rpc.publicnode.com}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-}
      BITCOIN_RPC_PASS: ${BITCOIN_RPC_PASS:-}
      BITCOIN_SYNC_INTERVAL: ${BITCOIN_SYNC_INTERVAL:-10}
      STACKS_RPC_URL: ${STACKS_RPC_URL:-https://api.mainnet.hiro.so}
      STACKS_SYNC_INTERVAL: ${STACKS_SYNC_INTERVAL:-30}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-https://api.infobip.com}
      ALEX_API_URL: ${ALEX_API_URL:-https://api.alexlab.co}
      FIAT_WEBHOOK_SECRET: ${FIAT_WEBHOOK_SECRET:-dev_fiat_webhook_secret}
      SETTLEMENT_INGRESS_SECRET: ${SETTLEMENT_INGRESS_SECRET:-dev_settlement_ingress_secret}
      API_TOKEN: ${API_TOKEN:-dev_api_token}
      RAMP_API_KEY: ${RAMP_API_KEY:-dev_ramp_api_key}
      INVESTEC_CLIENT_ID: ${INVESTEC_CLIENT_ID:-dev_investec_client_id}
      INVESTEC_SECRET: ${INVESTEC_SECRET:-dev_investec_secret}
      ALCHEMY_PAY_APP_ID: ${ALCHEMY_PAY_APP_ID:-dev_alchemy_pay_app_id}
      ALCHEMY_PAY_SECRET: ${ALCHEMY_PAY_SECRET:-dev_alchemy_pay_secret}
      BANXA_API_KEY: ${BANXA_API_KEY:-dev_banxa_api_key}
      BANXA_SECRET: ${BANXA_SECRET:-dev_banxa_secret}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-dev_infobip_api_key}
      HMAC_SECRET: ${HMAC_SECRET:-dev_hmac_secret}
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - conxian-gateway-data:/data
    restart: unless-stopped

volumes:
  conxian-db-data:
  conxian-redis-data:
  conxian-gateway-data:
