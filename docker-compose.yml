version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nexus}
    ports:
      - "5432:5432"
    volumes:
      - conxian-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - conxian-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus:
    build:
      context: ./conxian-nexus
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-nexus}
      REDIS_URL: redis://redis:6379/
      STACKS_NODE_RPC_URL: ${STACKS_NODE_RPC_URL:-https://api.mainnet.hiro.so}
      REST_PORT: '3000'
      GRPC_PORT: '50051'
      RUST_LOG: ${NEXUS_RUST_LOG:-info}
      NEXUS_ORACLE_ENABLED: ${NEXUS_ORACLE_ENABLED:-0}
      NEXUS_ORACLE_STUB_OK: ${NEXUS_ORACLE_STUB_OK:-1}
      NEXUS_EXPERIMENTAL_APIS: ${NEXUS_EXPERIMENTAL_APIS:-1}
    ports:
      - "3001:3000"
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      API_PORT: '3000'
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-https://bitcoin-rpc.publicnode.com}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-}
      BITCOIN_RPC_PASS: ${BITCOIN_RPC_PASS:-}
      BITCOIN_SYNC_INTERVAL: ${BITCOIN_SYNC_INTERVAL:-10}
      STACKS_RPC_URL: ${STACKS_RPC_URL:-https://api.mainnet.hiro.so}
      STACKS_SYNC_INTERVAL: ${STACKS_SYNC_INTERVAL:-30}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-https://api.infobip.com}
      ALEX_API_URL: ${ALEX_API_URL:-https://api.alexlab.co}
      FIAT_WEBHOOK_SECRET: ${FIAT_WEBHOOK_SECRET:-dev-fiat-webhook-secret}
      SETTLEMENT_INGRESS_SECRET: ${SETTLEMENT_INGRESS_SECRET:-dev-settlement-ingress-secret}
      API_TOKEN: ${API_TOKEN:-dev-api-token}
      RAMP_API_KEY: ${RAMP_API_KEY:-dev-ramp-api-key}
      INVESTEC_CLIENT_ID: ${INVESTEC_CLIENT_ID:-dev-investec-client-id}
      INVESTEC_SECRET: ${INVESTEC_SECRET:-dev-investec-secret}
      ALCHEMY_PAY_APP_ID: ${ALCHEMY_PAY_APP_ID:-dev-alchemy-pay-app-id}
      ALCHEMY_PAY_SECRET: ${ALCHEMY_PAY_SECRET:-dev-alchemy-pay-secret}
      BANXA_API_KEY: ${BANXA_API_KEY:-dev-banxa-api-key}
      BANXA_SECRET: ${BANXA_SECRET:-dev-banxa-secret}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-dev-infobip-api-key}
      HMAC_SECRET: ${HMAC_SECRET:-dev-hmac-secret}
    ports:
      - "3000:3000"
    volumes:
      - conxian-gateway-data:/data
    restart: unless-stopped

volumes:
  conxian-db-data:
  conxian-redis-data:
  conxian-gateway-data:
