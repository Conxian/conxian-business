name: Secret Scan

on:
  pull_request:
    branches: [ main, staged, dev ]
  push:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check gitleaks license availability
        id: gitleaks_license
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          if [[ -n "${GITLEAKS_LICENSE}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip licensed gitleaks scan (license not configured)
        if: ${{ steps.gitleaks_license.outputs.available != 'true' }}
        run: |
          echo "::warning::Skipping gitleaks action because GITLEAKS_LICENSE is not configured for this repository/environment."

      - name: Scan
        if: ${{ steps.gitleaks_license.outputs.available == 'true' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
