name: Sense Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  sense:
    name: Sense production surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Domain topology + liveness
        id: domain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/verify_domain_topology.py

      - name: Render deploy health
        id: render
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 scripts/verify_render_deploys.py

      - name: Toolchain drift
        id: drift
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_toolchain_drift.py

      - name: Open outage issue on failure
        if: always() && (steps.domain.outcome == 'failure' || steps.render.outcome == 'failure' || steps.drift.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[ops] Production surface check failed"
          if gh issue list --state open --json title --jq '.[].title' | grep -qF "$title"; then
            echo "Open issue already exists; skipping."
          else
            gh issue create \
              --title "$title" \
              --body "The production surface check failed on $(date -u +%Y-%m-%dT%H:%M:%SZ). See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
