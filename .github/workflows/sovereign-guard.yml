name: Sovereign Guard

on:
  push:
    paths:
      - 'Conxian/**'
  pull_request:
    paths:
      - 'Conxian/**'

permissions:
  contents: read

jobs:
  contamination-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Run Contamination Guard
        run: python scripts/verify_contamination_guard.py
