name: Sovereign Guard

on:
  push:
    paths:
      - 'Conxian/**'
  pull_request:
    paths:
      - 'Conxian/**'

permissions:
  contents: read

jobs:
  contamination-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # ratchet:actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run Contamination Guard
        run: python scripts/verify_contamination_guard.py
