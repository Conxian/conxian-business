name: Weekly Viability Report

on:
  schedule:
    # Monday 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to assess (default: all)'
        required: false
        default: ''

jobs:
  viability-report:
    name: Generate Portfolio Viability Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate Markdown Report
        run: |
          python3 scripts/repo_viability_assessment.py --all --format markdown --output viability-report.md

      - name: Generate JSON Report
        run: |
          python3 scripts/repo_viability_assessment.py --all --format json --output viability-report.json

      - name: Find latest report PR or create new one
        id: find-pr
        run: |
          # Check for existing PR with viability report label
          PR_NUMBER=$(gh pr list \
            --label "viability-report" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$PR_NUMBER" ]; then
            echo "Found existing PR: #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "No existing PR found"
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR with report
        if: steps.find-pr.outputs.pr_number == ''
        run: |
          # Create a new branch for the report
          REPORT_BRANCH="viability-report-$(date +%Y%m%d)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b $REPORT_BRANCH
          git add viability-report.md viability-report.json
          git commit -m "docs: update viability report $(date +%Y-%m-%d)"
          git push origin $REPORT_BRANCH --force

          # Create PR
          cat > viability-pr-body.md <<EOF
          ## Weekly Repository Viability Report

          This PR was automatically generated by the weekly viability report workflow.

          **Generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Summary

          See \`viability-report.md\` for the full report.

          ### Changes

          - Updated repository viability scores
          - JSON data available at \`viability-report.json\`

          ---
          *Generated by GitHub Actions* [bot]
          EOF

          gh pr create \
            --title "Viability Report $(date +%Y-%m-%d)" \
            --body-file viability-pr-body.md \
            --label "viability-report" \
            --label "automated"

      - name: Post summary comment on latest PR
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          PR_NUMBER=${{ steps.find-pr.outputs.pr_number }}

          # Get summary from markdown
          SUMMARY=$(head -30 viability-report.md | tail -20)

          cat > viability-comment.md <<EOF
          ## Weekly Viability Report Update

          **Generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          <details>
          <summary>Latest Scores</summary>

          \`\`\`
          $(tail -15 viability-report.md)
          \`\`\`

          </details>

          ---
          *Auto-generated by GitHub Actions*
          EOF

          gh pr comment "$PR_NUMBER" --body-file viability-comment.md

      - name: Create GitHub Issue for Critical Repos
        run: |
          # Parse JSON and find repos below threshold
          CRITICAL="$(python3 - <<'PY'
          import json

          with open('viability-report.json', encoding='utf-8') as f:
              repos = json.load(f)

          for repo in repos:
              if repo['score'] < 40:  # BLOCKED threshold
                  print(f"{repo['repo']}: {repo['score']}/80 - {repo['classification']}")
          PY
          )"

          if [ -n "$CRITICAL" ]; then
            echo "Creating issue for critical repositories..."
            cat > viability-issue-body.md <<EOF
            ## Repository Viability Alert

            The following repositories have viability scores below 40/80 (BLOCKED):

            \`\`\`
            $CRITICAL
            \`\`\`

            **Generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)

            ### Recommended Actions

            1. Review the specific blockers for each repository
            2. Create Linear issues to track remediation
            3. Schedule dedicated sprints to address critical gaps

            See full report at: viability-report.md

            ---
            *Auto-generated by GitHub Actions*
            EOF

            gh issue create \
              --title "Critical: Repository Viability Below Threshold" \
              --body-file viability-issue-body.md \
              --label "critical" \
              --label "viability-report"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: viability-report-${{ github.run_number }}
          path: |
            viability-report.md
            viability-report.json
          retention-days: 30
