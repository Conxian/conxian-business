name: Branch Promotion Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
    branches: [main, staged, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: Enforce branch promotion rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # Pull-request events run the policy from the proposed merge commit so
          # this finite bootstrap can validate the policy it introduces.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Enforce exact route and evidence matrix
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/branch_promotion_policy.py --event-path "$GITHUB_EVENT_PATH"
