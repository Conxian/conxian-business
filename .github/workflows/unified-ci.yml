# Unified CI Workflow
# Consolidates all CI checks into a single orchestrator
# Replaces multiple workflow files with one cohesive pipeline

name: Unified CI

on:
  push:
    branches: [ main, staged, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitbook.yaml'
  pull_request:
    branches: [ main, staged, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # HYGIENE CHECKS
  # ============================================
  hygiene:
    name: Hygiene Check
    uses: ./.github/workflows/reusable/hygiene.yml

  # ============================================
  # DEPENDENCY CHECKS
  # ============================================
  dependency-review:
    name: Dependency Review
    uses: ./.github/workflows/reusable/dependency-review.yml

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/reusable/secret-scan.yml

  # ============================================
  # RUST CI (if Cargo.toml exists)
  # ============================================
  rust-ci:
    name: Rust CI
    uses: ./.github/workflows/reusable/rust-ci.yml

  # ============================================
  # NODE.JS CI (if package.json exists)
  # ============================================
  node-ci:
    name: Node.js CI
    uses: ./.github/workflows/reusable/node-ci.yml

  # ============================================
  # CODEQL (for TypeScript repos)
  # ============================================
  codeql:
    name: CodeQL Analysis
    uses: ./.github/workflows/reusable/codeql.yml
    with:
      languages: typescript

  # ============================================
  # SUMMARY
  # ============================================
  summary:
    name: CI Summary
    needs: [hygiene, dependency-review, secret-scan, rust-ci, node-ci, codeql]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI Pipeline Results"
          echo ""

          echo "| Job | Status |"
          echo "|-----|--------|"

          # Extract job results
          for job in hygiene dependency-review secret-scan rust-ci node-ci codeql; do
            result=$(cat $GITHUB_OUTPUT 2>/dev/null || echo "")
            status="✅ Passed"
            # This is simplified - in production, you'd parse needs context
          done

          echo ""
          echo "✅ All checks complete. See individual jobs for details."
