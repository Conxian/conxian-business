name: Action Version Audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_action_versions.py'
  push:
    branches: [main, staged, dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_action_versions.py'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday morning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate action version references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1

      - name: Restore version check cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6
        id: cache-restore
        with:
          path: .github/.action-version-cache.json
          key: action-version-cache-${{ github.run_id }}
          restore-keys: |
            action-version-cache-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Validate action versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_action_versions.py

      - name: Save version check cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/save@v6
        with:
          path: .github/.action-version-cache.json
          key: action-version-cache-${{ github.run_id }}
