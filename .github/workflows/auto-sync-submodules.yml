name: Auto Sync Submodules

on:
  schedule:
    # Run at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}

      - name: Update submodules to latest tracked branches
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # `.gitmodules` intentionally does not set `submodule.<name>.branch`.
          # Update only top-level submodule gitlinks (this repo's pins). Nested submodules
          # are synced to whatever each top-level submodule commit pins.

          # Map of submodule names to their canonical upstream branch when it is not `main`.
          # If you add a submodule whose canonical branch is not `main` or `master`,
          # add an entry here so the auto-sync workflow can resolve its branch.
          declare -A PREFERRED_BRANCHES=(
            [lib-conclave-sdk]=master
          )

          pick_branch() {
            local url="$1"
            local preferred="$2"

            if git ls-remote --exit-code --heads "$url" "$preferred" >/dev/null 2>&1; then
              echo "$preferred"
              return 0
            fi

            for fallback in main master; do
              if git ls-remote --exit-code --heads "$url" "$fallback" >/dev/null 2>&1; then
                echo "$fallback"
                return 0
              fi
            done

            return 1
          }

          while IFS= read -r key; do
            path=$(git config -f .gitmodules --get "$key")

            name=${key#submodule.}
            name=${name%.path}

            url=$(git config -f .gitmodules --get "submodule.${name}.url")

            preferred=${PREFERRED_BRANCHES[$name]:-main}

            if ! branch=$(pick_branch "$url" "$preferred"); then
              echo "::error::auto-sync-submodules: unable to find an upstream branch for '${name}' (url: ${url}). Ensure the repo exposes a 'main' or 'master' branch, or add '${name}' to PREFERRED_BRANCHES with its canonical branch."
              exit 1
            fi

            git config "submodule.${name}.branch" "$branch"
            git submodule update --init --remote -- "$path"
          done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$')

          git submodule update --init --recursive

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          commit-message: "chore: auto-sync submodules"
          title: "chore: auto-sync submodules"
          body: |
            Automated submodule update to the latest configured branches.

            This workflow intentionally opens a PR rather than pushing directly to `main`.
          branch: bot/auto-sync-submodules
          delete-branch: true
