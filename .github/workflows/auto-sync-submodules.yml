name: Submodule Pin Integrity Audit

on:
  schedule:
    # Daily policy audit; does not mutate branches or open PRs.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-submodule-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (pinned submodule SHAs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Ensure submodules are initialized
        run: |
          git submodule sync --recursive
          # Init public submodules only. conxian-market is private (update=none).
          git submodule update --init -- \
            Conxian \
            conxian-gateway \
            conxian-labs-site \
            conxian-nexus \
            conxian-ui \
            conxius-enclave-sdk \
            conxius-orbit \
            conxius-platform \
            conxius-wallet \
            lib-conxian-core
          git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Verify submodule integrity and update-policy hardening
        run: |
          python3 scripts/verify_submodule_integrity.py

      - name: Verify production contamination guard
        run: |
          python3 scripts/verify_contamination_guard.py
