name: Auto Sync Submodules

on:
  schedule:
    # Run at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}

      - name: Update submodules to latest tracked branches
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # `.gitmodules` intentionally does not set `submodule.<name>.branch`.
          # Update only top-level submodule gitlinks (this repo's pins). Nested submodules
          # are synced to whatever each top-level submodule commit pins.

          # Map of submodule names to their preferred upstream branch.
          # Resolution order is:
          # 1) explicit override (if present)
          # 2) `main`
          # 3) `master`
          #
          # If you add a submodule that has neither `main` nor `master`, add an entry here.
          declare -A PREFERRED_BRANCHES=(
            [lib-conclave-sdk]=master
          )

          pick_branch() {
            local path="$1"
            local preferred="$2"

            if git -C "$path" ls-remote --exit-code --heads origin "$preferred" >/dev/null 2>&1; then
              echo "$preferred"
              return 0
            fi

            for fallback in main master; do
              if git -C "$path" ls-remote --exit-code --heads origin "$fallback" >/dev/null 2>&1; then
                echo "$fallback"
                return 0
              fi
            done

            return 1
          }

          submodules_list="$(mktemp)"
          git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$' >"${submodules_list}"

          while IFS= read -r key; do
            path=$(git config -f .gitmodules --get "$key")

            name=${key#submodule.}
            name=${name%.path}

            preferred=${PREFERRED_BRANCHES[$name]:-main}

            git submodule update --init -- "$path"

            if ! branch=$(pick_branch "$path" "$preferred"); then
              echo "auto-sync-submodules: unable to resolve an upstream branch for '${name}'; add an entry to PREFERRED_BRANCHES in .github/workflows/auto-sync-submodules.yml" >&2
              exit 1
            fi

            git config "submodule.${name}.branch" "$branch"
            git submodule update --remote -- "$path"
            if [ -f "$path/.gitmodules" ]; then
              git -C "$path" submodule update --init --recursive
            fi
          done <"${submodules_list}"

          rm -f "${submodules_list}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          commit-message: "chore: auto-sync submodules"
          title: "chore: auto-sync submodules"
          body: |
            Automated submodule update to the latest configured branches.

            This workflow intentionally opens a PR rather than pushing directly to `main`.
          branch: bot/auto-sync-submodules
          delete-branch: true
