name: Repo Metadata CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify knowledge retention manifest coverage
        run: python3 scripts/verify_knowledge_retention.py

      - name: Validate markdown links
        run: python3 scripts/check_links.py

      - name: Assert README metadata sections exist
        run: |
          grep -q '^## Purpose$' README.md
          grep -q '^## Status$' README.md

      - name: Assert changelog discipline
        run: |
          grep -q '^## \[Unreleased\]$' CHANGELOG.md
