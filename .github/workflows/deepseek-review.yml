name: DeepSeek Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/deepseek-review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Gather PR context
        id: context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = context.payload.issue;
            let prNumber = pr?.number;
            let title = pr?.title || issue?.title || '';
            let body = pr?.body || issue?.body || '';

            if (!prNumber && issue) {
              // Try to extract PR info from issue comment trigger
              const commentBody = context.payload.comment?.body || '';
              const prMatch = commentBody.match(/\/deepseek-review\s+#?(\d+)/);
              if (prMatch) prNumber = parseInt(prMatch[1]);
            }

            if (prNumber) {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              title = prData.title;
              body = prData.body || '';
            }

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('title', title);
            core.setOutput('body', (body || '').substring(0, 4000));

      - name: DeepSeek code review
        id: deepseek_call
        uses: ./.github/actions/run-deepseek
        with:
          deepseek_api_key: '${{ secrets.DEEPSEEK_API_KEY }}'
          model: '${{ vars.DEEPSEEK_MODEL || "deepseek-chat" }}'
          temperature: '0.3'
          max_tokens: '4096'
          system_prompt: |
            You are a senior software engineer conducting code review for the Conxian protocol (Bitcoin/Stacks/Clarity).
            Be rigorous, concise, and actionable. Focus on:
            1. Security vulnerabilities (reentrancy, auth bypass, overflow)
            2. Correctness (logic errors, edge cases, invariants)
            3. Code quality (Clarity best practices, Rust safety, TypeScript patterns)
            4. Testing gaps
            Flag issues as: 🔴 CRITICAL, 🟡 WARNING, 🟢 SUGGESTION.
            Do NOT praise or summarize unless there's a real issue to highlight.
          prompt: |
            Review this pull request for the Conxian protocol.

            PR Title: ${{ steps.context.outputs.title }}

            PR Body:
            ${{ steps.context.outputs.body }}

            Provide a concise review. Skip if nothing meaningful to flag.

      - name: Post review comment
        if: steps.context.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const response = `${{ steps.deepseek_call.outputs.response }}`;
            if (!response || response.startsWith('ERROR:')) return;

            const prNumber = ${{ steps.context.outputs.pr_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🤖 DeepSeek Code Review\n\n${response}\n\n---\n*Generated by DeepSeek (${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}) via [Conxian CI](https://github.com/Conxian/conxian-business/actions/runs/${{ github.run_id }})*`
            });
