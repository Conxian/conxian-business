name: Reconcile Branches (detect-only)

# Detects reverse drift (main ahead of staged, or staged ahead of dev) and
# reports it. Downward back-merges are intentionally DISABLED: the promotion
# chain is enforced forward-only (dev -> staged -> main). Reverse drift is a
# symptom of direct-to-main merges, which are now rejected at the source by the
# branch-promotion-policy required status check on `main`.

on:
  schedule:
    # Daily at 06:17 UTC.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Detect and report reverse drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Report detected drift
        env:
          GH_TOKEN: ${{ secrets.ORG_RECONCILE_PAT }}
          GITHUB_REPOSITORY_OWNER: Conxian
        run: python3 scripts/reconcile_branches.py --detect
