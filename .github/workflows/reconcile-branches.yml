name: Reconcile Branches (sync-down)

# Re-syncs downward (main -> staged -> dev) so branches do not drift.
# Forward auto-promotion advances `main`/`staged` via merge commits, but the
# lower branches are never updated in return, so they fall behind. This job
# opens (and auto-merges) downward back-merge PRs to keep dev == staged == main.

on:
  schedule:
    # Daily at 06:17 UTC.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Sync branches down (main -> staged -> dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Reconcile drift (open + auto-merge back-merge PRs)
        env:
          GH_TOKEN: ${{ secrets.ORG_RECONCILE_PAT }}
          GITHUB_REPOSITORY_OWNER: Conxian
        run: python3 scripts/reconcile_branches.py --reconcile
