name: Auto-Promotion

on:
  push:
    branches: [dev, staged]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to promote from'
        required: true
        type: choice
        options:
          - dev
          - staged
      target_branch:
        description: 'Target branch to promote into'
        required: true
        type: choice
        options:
          - staged
          - main

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Create promotion PR
    runs-on: ubuntu-latest
    # On push, only run for the actual branch update (not tag pushes).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Determine source and target
        id: branches
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || '' }}
        run: |
          set -euo pipefail
          SOURCE="${SOURCE_REF}"
          TARGET="${TARGET_REF}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${SOURCE}:${TARGET}" in
              dev:staged|staged:main) ;;
              *)
                echo "::error::Invalid promotion pair: ${SOURCE} -> ${TARGET}. Allowed: dev->staged, staged->main"
                exit 1
                ;;
            esac
          else
            case "$SOURCE" in
              dev) TARGET="staged" ;;
              staged) TARGET="main" ;;
              *)
                echo "::error::Unsupported source branch: $SOURCE"
                exit 1
                ;;
            esac
          fi

          if [ "$SOURCE" = "dev" ]; then
            CHECKLIST_TAG="PROMOTION:DEV->STAGED"
          else
            CHECKLIST_TAG="PROMOTION:STAGED->MAIN"
          fi

          PROMO_BRANCH="promotion/${SOURCE}-to-${TARGET}"
          {
            echo "source=${SOURCE}"
            echo "target=${TARGET}"
            echo "checklist_tag=${CHECKLIST_TAG}"
            echo "promo_branch=${PROMO_BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Check for direct and generated promotion PRs
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
          PROMO_BRANCH: ${{ steps.branches.outputs.promo_branch }}
        run: |
          set -euo pipefail
          DIRECT="$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$SOURCE" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"
          PROMOTION="$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$PROMO_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"
          {
            echo "direct_number=${DIRECT}"
            echo "promotion_number=${PROMOTION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout source branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
        with:
          ref: ${{ steps.branches.outputs.source }}
          fetch-depth: 0

      - name: Get exact promotion candidate details
        id: details
        env:
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          SOURCE_SHA="$(git rev-parse HEAD)"
          TARGET_SHA="$(git rev-parse "origin/${TARGET}")"
          COMMITS="$(git log --max-count=20 --oneline --no-merges "${TARGET_SHA}..${SOURCE_SHA}")"

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "target_sha=${TARGET_SHA}"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No new commits to promote from ${SOURCE} to ${TARGET}."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo 'commit_summary<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate exact-candidate PR body
        if: steps.details.outputs.skip != 'true'
        env:
          SOURCE: ${{ steps.branches.outputs.source }}
          TARGET: ${{ steps.branches.outputs.target }}
          CHECKLIST_TAG: ${{ steps.branches.outputs.checklist_tag }}
          COMMIT_SUMMARY: ${{ steps.details.outputs.commit_summary }}
          SOURCE_SHA: ${{ steps.details.outputs.source_sha }}
          TARGET_SHA: ${{ steps.details.outputs.target_sha }}
          PROMO_BRANCH: ${{ steps.branches.outputs.promo_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path

          source = os.environ['SOURCE']
          target = os.environ['TARGET']
          checklist_tag = os.environ['CHECKLIST_TAG']
          commits = os.environ['COMMIT_SUMMARY']
          source_sha = os.environ['SOURCE_SHA']
          target_sha = os.environ['TARGET_SHA']
          promo_branch = os.environ['PROMO_BRANCH']
          date_str = datetime.date.today().isoformat()

          candidate = f'''<!-- AUTO_PROMOTION_CANDIDATE_START -->
          ### Exact promotion candidate

          - Source: `{source}` at `{source_sha}`
          - Target: `{target}` at `{target_sha}`
          - Generated branch: `{promo_branch}`
          <!-- AUTO_PROMOTION_CANDIDATE_END -->'''

          included = f'''### Included changes
          ```text
          {commits}
          ```'''

          if source == 'dev' and target == 'staged':
              body = f'''## Dev → Staged Promotion

          Auto-generated promotion PR from `dev` to `staged`.

          {candidate}

          {included}

          ---

          <!-- {checklist_tag} -->
          ### Dev -> staged promotion checklist

          - [ ] Integrated testnet validation completed on `dev` and is linked here.
          - [ ] Required CI checks are green for the exact promotion candidate commit.
          - [ ] Wallet / signer / treasury boundary checks are explicitly recorded.
          - [ ] Deployment boundary checks are explicitly recorded.
          - [ ] Any required submodule pins, lockfiles, and artifact provenance are updated.

          ---

          *This PR was auto-generated by the Auto-Promotion workflow.*
          '''
              title = f'PROMOTION:DEV->STAGED — {date_str}'
          else:
              body = f'''## Staged → Main Promotion

          Auto-generated promotion PR from `staged` to `main`.

          {candidate}

          {included}

          ---

          <!-- {checklist_tag} -->
          ### Mainnet acceptance evidence pack

          Required for `staged` -> `main` promotions. Provide the evidence pack under this heading, or link to a versioned in-repo file per `openspec/specs/mainnet-acceptance-evidence-pack/spec.md`.

          ---

          *This PR was auto-generated by the Auto-Promotion workflow.*
          '''
              title = f'PROMOTION:STAGED->MAIN — {date_str}'

          Path('pr_body.md').write_text(body.lstrip(), encoding='utf-8')
          Path('pr_title.txt').write_text(title, encoding='utf-8')
          Path('candidate_block.md').write_text(candidate.strip(), encoding='utf-8')
          Path('included_block.md').write_text(included.strip(), encoding='utf-8')
          PY

      - name: Synchronize generated promotion branch
        if: steps.existing.outputs.direct_number == '' && steps.details.outputs.skip != 'true'
        env:
          PROMO_BRANCH: ${{ steps.branches.outputs.promo_branch }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${PROMO_BRANCH}:refs/remotes/origin/${PROMO_BRANCH}" 2>/dev/null || true
          REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${PROMO_BRANCH}" 2>/dev/null || true)"
          git checkout --detach "${{ steps.details.outputs.source_sha }}"

          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/${PROMO_BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${PROMO_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${PROMO_BRANCH}:" \
              origin "HEAD:refs/heads/${PROMO_BRANCH}"
          fi

      - name: Refresh existing generated promotion PR
        if: steps.existing.outputs.direct_number == '' && steps.existing.outputs.promotion_number != '' && steps.details.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_NUMBER: ${{ steps.existing.outputs.promotion_number }}
          TARGET: ${{ steps.branches.outputs.target }}
        run: |
          set -euo pipefail
          gh pr view "$PROMOTION_NUMBER" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq .body > current_pr_body.md
          python3 - "$TARGET" <<'PY'
          import sys
          from pathlib import Path

          target = sys.argv[1]
          current = Path('current_pr_body.md').read_text(encoding='utf-8')
          candidate = Path('candidate_block.md').read_text(encoding='utf-8').strip()
          included = Path('included_block.md').read_text(encoding='utf-8').strip()
          start = '<!-- AUTO_PROMOTION_CANDIDATE_START -->'
          end = '<!-- AUTO_PROMOTION_CANDIDATE_END -->'

          if start in current and end in current:
              before = current.split(start, 1)[0]
              after = current.split(end, 1)[1]
              updated = f'{before}{candidate}{after}'
          elif target == 'main' and '### Mainnet acceptance evidence pack' in current:
              evidence = current[current.index('### Mainnet acceptance evidence pack'):]
              prefix = current[:current.index('### Mainnet acceptance evidence pack')]
              updated = f'{prefix}{candidate}\n\n{included}\n\n---\n\n{evidence}'
          elif '<!-- PROMOTION:DEV->STAGED -->' in current:
              checklist = current[current.index('<!-- PROMOTION:DEV->STAGED -->'):]
              prefix = current[:current.index('<!-- PROMOTION:DEV->STAGED -->')]
              updated = f'{prefix}{candidate}\n\n{included}\n\n---\n\n{checklist}'
          else:
              updated = f'{current.rstrip()}\n\n{candidate}\n\n{included}\n'

          Path('updated_pr_body.md').write_text(updated, encoding='utf-8')
          PY
          gh pr edit "$PROMOTION_NUMBER" \
            --repo "${{ github.repository }}" \
            --title "$(cat pr_title.txt)" \
            --body-file updated_pr_body.md
          echo "::notice::Refreshed promotion PR #${PROMOTION_NUMBER} to the exact source candidate."

      - name: Create promotion PR when permitted
        if: steps.existing.outputs.direct_number == '' && steps.existing.outputs.promotion_number == '' && steps.details.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.branches.outputs.target }}
          PROMO_BRANCH: ${{ steps.branches.outputs.promo_branch }}
        run: |
          set -euo pipefail
          if gh pr create \
            --repo "${{ github.repository }}" \
            --base "$TARGET" \
            --head "$PROMO_BRANCH" \
            --title "$(cat pr_title.txt)" \
            --body-file pr_body.md >/tmp/auto-promotion-create.out 2>/tmp/auto-promotion-create.err; then
            echo "::notice::Created promotion PR from ${PROMO_BRANCH} to ${TARGET}."
          else
            {
              echo "### Auto-Promotion fallback"
              echo
              echo "The promotion branch \\`${PROMO_BRANCH}\\` was synchronized to the exact source candidate, but the repository's current Actions token is not permitted to create pull requests."
              echo "Open a PR manually from \\`${PROMO_BRANCH}\\` to \\`${TARGET}\\`; no protected branch was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Promotion branch ${PROMO_BRANCH} is ready, but Actions cannot create pull requests with the approved token. Manual PR creation is required."
          fi

      - name: Report direct promotion PR
        if: steps.existing.outputs.direct_number != ''
        run: |
          echo "::notice::Direct source-to-target promotion PR #${{ steps.existing.outputs.direct_number }} is already open; no generated promotion PR was created."

      - name: Report existing generated promotion PR
        if: steps.existing.outputs.direct_number == '' && steps.existing.outputs.promotion_number != ''
        run: |
          echo "::notice::Generated promotion PR #${{ steps.existing.outputs.promotion_number }} was synchronized to the current source candidate."

      - name: Report nothing to promote
        if: steps.details.outputs.skip == 'true'
        run: |
          echo "::notice::No new commits between ${{ steps.branches.outputs.source }} and ${{ steps.branches.outputs.target }}."
