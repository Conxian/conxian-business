# Reusable Hygiene Check Workflow
# Usage: Call from other workflows with: workflow_call
# Checks: trailing whitespace, merge conflicts, large files, etc.

name: Reusable Hygiene Check

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for merge conflict markers
        run: |
          echo "Checking for merge conflict markers..."
          CONFLICTS=$(grep -r "<<<<<<" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.rs" --include="*.md" . 2>/dev/null | grep -v node_modules | grep -v target || true)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ Found merge conflict markers:"
            echo "$CONFLICTS"
            exit 1
          fi
          echo "✅ No merge conflict markers found"

      - name: Check for console.log/println in source
        run: |
          echo "Checking for debug statements..."
          DEBUG=$(grep -rn "console\.log\|println!\|print!(" --include="*.ts" --include="*.tsx" --include="*.rs" . 2>/dev/null | grep -v node_modules | grep -v target | grep -v ".test." | grep -v ".spec." || true)
          if [ -n "$DEBUG" ]; then
            echo "⚠️ Found potential debug statements:"
            echo "$DEBUG" | head -10
          else
            echo "✅ No debug statements in source"
          fi

      - name: Check for TODO/FIXME in source
        run: |
          echo "Checking for TODOs..."
          TODOS=$(grep -rn "TODO:\|FIXME:\|XXX:\|HACK:" --include="*.ts" --include="*.tsx" --include="*.rs" . 2>/dev/null | grep -v node_modules | grep -v target | grep -v CHANGELOG || true)
          if [ -n "$TODOS" ]; then
            echo "📝 Found TODO/FIXME comments:"
            echo "$TODOS" | head -20
          else
            echo "✅ No TODO/FIXME comments"
          fi

      - name: Check for large files
        run: |
          echo "Checking for large files (>5MB)..."
          LARGE=$(find . -type f -size +5M 2>/dev/null | grep -v node_modules | grep -v target | grep -v ".git" || true)
          if [ -n "$LARGE" ]; then
            echo "⚠️ Found large files:"
            echo "$LARGE"
          else
            echo "✅ No large files found"
          fi

      - name: Check for trailing whitespace
        run: |
          echo "Checking for trailing whitespace..."
          TRAILING=$(grep -rn " $" --include="*.ts" --include="*.tsx" --include="*.rs" --include="*.md" --include="*.yml" . 2>/dev/null | grep -v node_modules | grep -v target || true)
          if [ -n "$TRAILING" ]; then
            echo "⚠️ Found trailing whitespace in:"
            echo "$TRAILING" | head -10
          else
            echo "✅ No trailing whitespace"
          fi

      - name: Check for binary files in source
        run: |
          echo "Checking for binary files in source..."
          BINARY=$(find . -type f \( -name "*.exe" -o -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) 2>/dev/null | grep -v node_modules | grep -v target | grep -v ".git" || true)
          if [ -n "$BINARY" ]; then
            echo "⚠️ Found binary files in source:"
            echo "$BINARY"
          else
            echo "✅ No binary files in source"
          fi
