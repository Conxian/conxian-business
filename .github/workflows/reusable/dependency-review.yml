# Reusable Dependency Review Workflow
# Usage: Call from other workflows with: workflow_call

name: Reusable Dependency Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@5d677c73a67c4e83531b4b2d72f63d3a04e0c08b # v4.5.2

  check-risky-permissions:
    name: Check Risky Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - name: Check for risky permissions in workflows
        run: |
          echo "Scanning for overly permissive workflow permissions..."
          RISKY=$(grep -r "permissions:" .github/workflows/ 2>/dev/null | grep -v "contents: read" | grep -v "pull-requests: read" | grep -v "id-token: write" || true)
          if [ -n "$RISKY" ]; then
            echo "⚠️ Found workflows with non-read permissions:"
            echo "$RISKY"
          else
            echo "✅ All workflows follow least-privilege principle"
          fi
