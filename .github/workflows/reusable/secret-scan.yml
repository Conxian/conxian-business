# Reusable Secret Scanning Workflow
# Usage: Call from other workflows with: workflow_call
# Supports: conxian-gateway, conxius-wallet, conxius-platform, lib-conxian-core, etc.

name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      paths:
        description: 'Paths to include in scan'
        required: false
        default: '.'
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 1
          path: ${{ inputs.paths }}

      - name: Install Gitleaks
        run: |
          VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Run Gitleaks
        run: |
          cd ${{ inputs.paths }}
          gitleaks detect --source . --verbose --redact --no-git

  trufflehog:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 1
          path: ${{ inputs.paths }}

      - name: Run TruffleHog
        run: |
          docker run --rm -v "$PWD/${{ inputs.paths }}:/src" trufflesecurity/trufflehog:latest file /src --no-update
