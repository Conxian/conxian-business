name: Render deployment audit conformance

on:
  pull_request:
    branches: [dev, staged, main]
    paths:
      - 'scripts/verify_render_deploys.py'
      - 'scripts/tests/test_render_deploys.py'
      - 'docs/operations/render-monitor-scope.json'
      - '.github/workflows/render-deployment-conformance.yml'
      - '.github/workflows/render-deployment-audit.yml'
  push:
    branches: [dev, staged, main]
    paths:
      - 'scripts/verify_render_deploys.py'
      - 'scripts/tests/test_render_deploys.py'
      - 'docs/operations/render-monitor-scope.json'
      - '.github/workflows/render-deployment-conformance.yml'
      - '.github/workflows/render-deployment-audit.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Exercise failure, pagination, scope and public-summary boundaries
        run: python3 -m unittest scripts.tests.test_render_deploys -v
