name: Organization review conformance

on:
  pull_request:
    branches: [dev, staged, main]
    paths:
      - 'scripts/bos_org_review.py'
      - 'scripts/tests/test_bos_org_review.py'
      - 'scripts/audit_org_delivery.py'
      - 'scripts/tests/test_audit_org_delivery.py'
      - '.github/workflows/org-review-conformance.yml'
  push:
    branches: [dev, staged, main]
    paths:
      - 'scripts/bos_org_review.py'
      - 'scripts/tests/test_bos_org_review.py'
      - 'scripts/audit_org_delivery.py'
      - 'scripts/tests/test_audit_org_delivery.py'
      - '.github/workflows/org-review-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify paginated inventory and incomplete-audit failure paths
        run: python3 -m unittest scripts.tests.test_bos_org_review scripts.tests.test_audit_org_delivery -v
