name: DeepSeek Plan-Execute

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  plan:
    if: contains(github.event.label.name, 'deepseek-plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Load repo context
        id: repo_context
        shell: bash
        run: |
          echo "tree<<EOF" >> "$GITHUB_OUTPUT"
          find . -maxdepth 2 -type f \( -name "*.clar" -o -name "*.rs" -o -name "*.ts" -o -name "Cargo.toml" -o -name "package.json" \) \
            ! -path "*/node_modules/*" ! -path "*/target/*" ! -path "*/.git/*" \
            | head -80
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: DeepSeek implementation plan
        id: deepseek_call
        uses: ./.github/actions/run-deepseek
        with:
          deepseek_api_key: '${{ secrets.DEEPSEEK_API_KEY }}'
          model: '${{ vars.DEEPSEEK_REASONER_MODEL || "deepseek-reasoner" }}'
          temperature: '0'
          max_tokens: '8192'
          system_prompt: |
            You are the Conxian protocol implementation planner. Given an issue, produce:
            1. **Problem analysis** (2-3 sentences)
            2. **Files to modify** (specific paths from the repo tree)
            3. **Implementation steps** (numbered, actionable)
            4. **Test strategy** (what to test and how)
            5. **Risk assessment** (what could go wrong)
            Focus on the Clarity contracts (contracts/), Rust services (src/), and TypeScript SDKs.
            Be specific about Clarity functions, Rust modules, and TS types.
          prompt: |
            Plan the implementation for this Conxian issue:

            Title: ${{ github.event.issue.title }}

            Description:
            ${{ github.event.issue.body }}

            Repository structure:
            ${{ steps.repo_context.outputs.tree }}

      - name: Post plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const response = `${{ steps.deepseek_call.outputs.response }}`;
            if (!response || response.startsWith('ERROR:')) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## 🤖 DeepSeek Implementation Plan\n\n${response}\n\n---\n*Generated by DeepSeek Reasoner (R1) via [Conxian CI](https://github.com/Conxian/conxian-business/actions/runs/${{ github.run_id }})*`
            });
