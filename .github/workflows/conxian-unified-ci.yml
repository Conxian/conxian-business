name: Conxian Unified CI

on:
  push:
    branches: [ main, staged, dev ]
  pull_request:
    branches: [ main, staged, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_detection:
    name: Detect CI suite triggers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      b2b: ${{ steps.filter_pr.outputs.b2b || steps.filter_push.outputs.b2b }}
    steps:
    - name: Detect B2B changes (PR)
      if: github.event_name == 'pull_request'
      id: filter_pr
      uses: dorny/paths-filter@v4
      with:
        filters: |
          b2b:
            - 'conxian-nexus'
            - 'conxian-nexus/**'
            - 'lib-conclave-sdk'
            - 'lib-conclave-sdk/**'
            - '.gitmodules'

    - name: Default B2B changes (push)
      if: github.event_name == 'push'
      id: filter_push
      run: |
        echo "b2b=true" >> $GITHUB_OUTPUT

  repo-hygiene:
    name: Repo Hygiene (ZSE & Submodules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
    - name: Verify knowledge retention (ZSE)
      run: |
        python3 scripts/verify_knowledge_retention.py
    - name: Verify submodule integrity
      run: |
        python3 scripts/verify_submodule_integrity.py
        git submodule status --recursive
    - name: Verify release hygiene (tags + changelog)
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 scripts/verify_release_hygiene.py

  gateway-suite:
    name: Gateway Suite
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: conxian-gateway
    - name: Check & Test
      run: |
        cd conxian-gateway
        cargo check -p api
        cargo test

  b2b-suite:
    name: B2B Suite (Nexus & SDK)
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          needs.change_detection.outputs.b2b == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'b2b')
        )
      )
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          conxian-nexus
          lib-conclave-sdk
    - name: Check & Test
      run: |
        cd conxian-nexus
        cargo test

        cd ../lib-conclave-sdk
        cargo test

  lib-conxian-core-suite:
    name: Core Library Suite (lib-conxian-core)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: clippy
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: lib-conxian-core
    - name: Check & Test
      run: |
        cd lib-conxian-core
        cargo test --locked
        cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Install cargo-audit
      uses: taiki-e/install-action@7a562dfa955aa2e4d5b0fd6ebd57ff9715c07b0b # v2
      with:
        tool: cargo-audit@0.22.1
    - name: Dependency audit
      run: |
        cd lib-conxian-core
        cargo audit

  b2c-wallet-suite:
    name: B2C Wallet Suite
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: conxius-wallet/package-lock.json
    - name: Install & Test
      run: |
        cd conxius-wallet
        npm ci
        npm test

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: conxius-wallet-test-artifacts
        path: |
          conxius-wallet/test-results
          conxius-wallet/playwright-report
          conxius-wallet/blob-report
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload coverage
      if: github.event_name == 'push' && hashFiles('conxius-wallet/coverage/**') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: conxius-wallet-coverage
        path: conxius-wallet/coverage
        if-no-files-found: ignore
        retention-days: 7

  audit-and-docs:
    name: Transparency Audit & Docs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'audit')
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
    - name: Run Audit
      run: |
        python3 conxian-business/transparency_custodian.py
    - name: Validate Summary
      run: |
        grep -oP '(?<=\]\().*?\.md(?=\))' SUMMARY.md | while read -r link; do
          if [ ! -f "$link" ]; then
            echo "ERROR: Broken link in SUMMARY.md -> $link"
            false
          fi
        done

  testnet-simulation:
    name: Testnet Simulation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'simulation')
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
    - name: Install & Simulate
      run: |
        pip install -r stacksorbit/requirements.txt
        python3 stacksorbit/conxian_testnet_deploy.py --help
