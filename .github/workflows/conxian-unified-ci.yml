name: Conxian Unified CI

on:
  push:
    branches: [ main, staged, dev ]
  pull_request:
    branches: [ main, staged, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_detection:
    name: Detect CI suite triggers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      b2b: ${{ (github.event_name == 'push' && steps.filter_push.outputs.b2b) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.b2b) || 'false' }}
      b2b_required: ${{ (github.event_name == 'push' && steps.filter_push.outputs.b2b_required) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.b2b_required) || 'false' }}
      docs_only: ${{ (github.event_name == 'push' && steps.filter_push.outputs.docs_only) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.docs_only) || 'false' }}
      code_impacting: ${{ (github.event_name == 'push' && steps.filter_push.outputs.code_impacting) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.code_impacting) || 'true' }}
      market: ${{ (github.event_name == 'push' && steps.filter_push.outputs.market) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.market) || 'false' }}
    steps:
    - name: Classify PR change scope
      if: github.event_name == 'pull_request'
      id: classify_pr
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          const pr = context.payload.pull_request;
          if (!pr) {
            core.setOutput('b2b', 'false');
            core.setOutput('b2b_required', 'false');
            core.setOutput('docs_only', 'false');
            core.setOutput('code_impacting', 'true');
            core.setOutput('market', 'false');
            return;
          }

          const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100,
          });

          const paths = changedFiles.map((file) => file.filename);

          const isDocsOnlyPath = (path) => (
            path.startsWith('docs/') ||
            path.endsWith('.md') ||
            path.endsWith('.rst') ||
            path === 'SUMMARY.md' ||
            path === 'CHANGELOG.md' ||
            (path.startsWith('.github/') && path.endsWith('.md'))
          );

          const codeImpacting = paths.some((path) => !isDocsOnlyPath(path));
          const docsOnly = !codeImpacting;
          const b2b = paths.some((path) => (
            path === 'conxian-nexus' ||
            path.startsWith('conxian-nexus/') ||
            path === 'conxius-enclave-sdk' ||
            path.startsWith('conxius-enclave-sdk/') ||
            path === '.gitmodules'
          ));
          const b2bLabel = (pr.labels || []).some((label) => label.name === 'b2b');
          const b2bRequired = b2b || b2bLabel;

          // Market integration patterns
          const market = paths.some((path) => (
            path === 'conxian-market' ||
            path.startsWith('conxian-market/') ||
            path === 'docs/MARKET_BOS_INTEGRATION_RESEARCH.md' ||
            path === 'docs/CROSS_REPO_DEPENDENCY_MAP.md' ||
            path === 'docs/REPO_VIABILITY_SCALE.md' ||
            path === 'docs/INTERNAL_SYSTEMS_REVIEW.md'
          ));

          core.setOutput('b2b', b2b ? 'true' : 'false');
          core.setOutput('b2b_required', b2bRequired ? 'true' : 'false');
          core.setOutput('docs_only', docsOnly ? 'true' : 'false');
          core.setOutput('code_impacting', codeImpacting ? 'true' : 'false');
          core.setOutput('market', market ? 'true' : 'false');

          core.info(`Detected ${paths.length} changed files for PR #${pr.number}.`);
          core.info(`b2b=${b2b}, docs_only=${docsOnly}, code_impacting=${codeImpacting}, market=${market}`);

    - name: Default push classification
      if: github.event_name == 'push'
      id: filter_push
      run: |
        echo "b2b=true" >> $GITHUB_OUTPUT
        echo "b2b_required=true" >> $GITHUB_OUTPUT
        echo "docs_only=false" >> $GITHUB_OUTPUT
        echo "code_impacting=true" >> $GITHUB_OUTPUT
        echo "market=true" >> $GITHUB_OUTPUT

  repo-hygiene:
    name: Repo Hygiene (ZSE & Submodules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: false
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: true
    - name: Require approved token and initialize pinned submodules
      env:
        CI_SUBMODULES_PAT: ${{ secrets.CI_SUBMODULES_PAT }}
      run: |
        bash scripts/ci/checkout_pinned_submodules.sh all
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
      with:
        python-version: '3.11'
    - name: Install Python dependency for LTS check
      run: |
        python3 -m pip install --disable-pip-version-check packaging
    - name: Verify knowledge retention (ZSE)
      run: |
        python3 scripts/verify_knowledge_retention.py
    - name: Run knowledge retention regression suite
      run: |
        python3 -m unittest -v tests/test_verify_knowledge_retention.py
    - name: Verify tracked artifacts
      if: ${{ hashFiles('scripts/verify_tracked_artifacts.py') != '' }}
      run: |
        python3 scripts/verify_tracked_artifacts.py
    - name: Verify compose env templates
      if: ${{ hashFiles('scripts/verify_compose_env_templates.py') != '' }}
      run: |
        python3 scripts/verify_compose_env_templates.py
    - name: Verify submodule secret filename hygiene (all)
      if: ${{ hashFiles('scripts/verify_submodule_secret_filenames.py') != '' }}
      run: |
        python3 scripts/verify_submodule_secret_filenames.py --all
    - name: Verify BOS production boundary
      if: ${{ hashFiles('scripts/verify_bos_production_boundary.py') != '' }}
      run: |
        python3 scripts/verify_bos_production_boundary.py
    - name: Verify submodule integrity and update policy
      if: ${{ hashFiles('scripts/verify_submodule_integrity.py') != '' }}
      run: |
        python3 scripts/verify_submodule_integrity.py
        git submodule status --recursive
    - name: Verify release hygiene (tags + changelog + README sync)
      if: ${{ hashFiles('scripts/verify_release_hygiene.py') != '' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERIFY_RELEASE_HYGIENE_CHECK_ORIGIN_TAGS: 'true'
        VERIFY_RELEASE_HYGIENE_TAG_EXPECTATION_MODE: 'require'
      run: |
        python3 scripts/verify_release_hygiene.py
    - name: Verify docs public-safe preflight
      if: ${{ hashFiles('scripts/build_pages_artifact_public_safe.sh') != '' }}
      run: |
        bash scripts/build_pages_artifact_public_safe.sh _pages_preflight
    - name: Verify governance baseline
      env:
        BOS_REQUIRE_PORTFOLIO_DOCS: 'true'
      run: |
        python3 scripts/verify_repo_governance_baseline.py
    - name: Verify LTS compliance
      if: ${{ hashFiles('scripts/verify_lts_compliance.py') != '' }}
      run: |
        python3 scripts/verify_lts_compliance.py
    - name: Verify wallet lifecycle control gates
      run: |
        python3 scripts/verify_wallet_lifecycle_control_gates.py
    - name: Verify production contamination guard
      if: ${{ hashFiles('scripts/verify_contamination_guard.py') != '' }}
      run: |
        python3 scripts/verify_contamination_guard.py
    - name: Verify Market BOS Integration
      run: |
        python3 scripts/verify_market_integration.py
    - name: Run Market MWP Tests
      run: |
        python3 scripts/market_bos_mwp_test.py
    - name: Repository Viability Assessment
      run: |
        python3 scripts/repo_viability_assessment.py --repo conxian-market
    - name: Enforce BOS PR classification
      if: ${{ github.event_name == 'pull_request' && hashFiles('scripts/verify_pr_bos_classification.py') != '' }}
      run: |
        python3 scripts/verify_pr_bos_classification.py

  gateway-suite:
    name: Gateway Suite
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # ratchet:dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # ratchet:Swatinem/rust-cache@v2
      with:
        workspaces: conxian-gateway
    - name: Check & Test
      run: |
        cd conxian-gateway
        cargo check -p api
        cargo test

  b2b-suite:
    name: B2B Suite (Nexus & SDK)
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true' &&
        (
          needs.change_detection.outputs.b2b == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'b2b')
        )
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # ratchet:dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # ratchet:Swatinem/rust-cache@v2
      with:
        workspaces: |
          conxian-nexus
          conxius-enclave-sdk
    - name: Verify pinned enclave SDK
      run: |
        test -d conxius-enclave-sdk
        test "$(git -C conxius-enclave-sdk rev-parse HEAD)" = "451202f51a9efed8fde70b7a5567a3e7e16c1db9"
        git submodule status conxius-enclave-sdk
    - name: Check & Test
      run: |
        cd conxian-nexus
        cargo test
    - name: Check & Test enclave SDK
      run: |
        cd conxius-enclave-sdk
        cargo fmt --package conxius-enclave-sdk -- --check
        cargo clippy --all-targets --all-features -- -D warnings
        cargo test --all-features
        cargo test telemetry --all-features -- --nocapture
    - name: Validate enclave SDK capability evidence
      if: ${{ hashFiles('conxius-enclave-sdk/scripts/validate_capability_evidence.py') != '' }}
      run: |
        python3 conxius-enclave-sdk/scripts/validate_capability_evidence.py --check

  lib-conxian-core-suite:
    name: Core Library Suite (lib-conxian-core)
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: clippy
    - name: Rust Cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # ratchet:Swatinem/rust-cache@v2
      with:
        workspaces: lib-conxian-core
    - name: Check & Test
      run: |
        cd lib-conxian-core
        cargo test --locked
        cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Install cargo-audit
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
      with:
        tool: cargo-audit@0.22.1
    - name: Dependency audit
      run: |
        cd lib-conxian-core
        # Temporary, narrow advisory allowlist:
        # rustls-webpki 0.101.7 is pulled transitively via bdk -> electrum-client.
        # lib-conxian-core currently tracks upstream bdk/electrum-client versions,
        # and a safe local upgrade path is not available in this repo without
        # broader dependency migration.
        cargo audit \
          --ignore RUSTSEC-2026-0098 \
          --ignore RUSTSEC-2026-0099 \
          --ignore RUSTSEC-2026-0104 \
          --ignore RUSTSEC-2026-0204 \
          --ignore RUSTSEC-2024-0388

  b2c-wallet-suite:
    name: B2C Wallet Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # ratchet:pnpm/action-setup@v6
      with:
        version: 9.15.9
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # ratchet:actions/setup-node@v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false
        # conxius-wallet is pnpm-lockfile-first; keep cache/install aligned to pnpm lockfile.
        cache: 'pnpm'
        cache-dependency-path: conxius-wallet/pnpm-lock.yaml
    - name: Verify pinned pnpm
      run: |
        PNPM_VERSION="$(pnpm --version)"
        if [ "$PNPM_VERSION" != "9.15.9" ]; then
          echo "Expected pnpm 9.15.9, got $PNPM_VERSION"
          exit 1
        fi
    - name: Install & Test
      run: |
        cd conxius-wallet
        pnpm install --frozen-lockfile --ignore-workspace
        pnpm test -- --reporter=verbose

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7
      with:
        name: conxius-wallet-test-artifacts
        path: |
          conxius-wallet/test-results
          conxius-wallet/playwright-report
          conxius-wallet/blob-report
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload coverage
      if: github.event_name == 'push' && hashFiles('conxius-wallet/coverage/**') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7
      with:
        name: conxius-wallet-coverage
        path: conxius-wallet/coverage
        if-no-files-found: ignore
        retention-days: 7

  audit-and-docs:
    name: Transparency Audit & Docs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'audit')
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
      with:
        python-version: '3.11'
    - name: Run Audit
      run: |
        python3 conxian-business/transparency_custodian.py
    - name: Validate Summary
      run: |
        grep -oP '(?<=\]\().*?\.md(?=\))' SUMMARY.md | while read -r link; do
          if [ ! -f "$link" ]; then
            echo "ERROR: Broken link in SUMMARY.md -> $link"
            false
          fi
        done

  testnet-simulation:
    name: Testnet Simulation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'simulation')
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # ratchet:actions/setup-python@v7.0.0
      with:
        python-version: '3.11'
    - name: Install & Simulate
      run: |
        pip install -r conxius-orbit/requirements.txt
        python3 conxius-orbit/conxian_testnet_deploy.py --help

  market-suite:
    name: Market Integration Suite
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.market == 'true'
      )
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: false
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: true
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Require approved token and initialize pinned market submodule
      env:
        CI_SUBMODULES_PAT: ${{ secrets.CI_SUBMODULES_PAT }}
      run: |
        bash scripts/ci/checkout_pinned_submodules.sh market
    - name: Verify Market BOS Integration
      run: |
        python3 scripts/verify_market_integration.py
    - name: Run Market MWP Tests
      run: |
        python3 scripts/market_bos_mwp_test.py
    - name: Repository Viability Assessment
      run: |
        python3 scripts/repo_viability_assessment.py --repo conxian-market

  ci-summary:
    name: CI Summary Gate
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    needs:
      - change_detection
      - repo-hygiene
      - gateway-suite
      - b2b-suite
      - lib-conxian-core-suite
      - b2c-wallet-suite
      - audit-and-docs
      - testnet-simulation
      - market-suite
    steps:
    - name: Checkout repository for summary gate
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: false
        token: ${{ github.token }}
        persist-credentials: false
    - name: Summarize results and enforce repo-content gate
      env:
        CHANGE_DETECTION_RESULT: ${{ needs.change_detection.result }}
        DOCS_ONLY: ${{ needs.change_detection.outputs.docs_only }}
        CODE_IMPACTING: ${{ needs.change_detection.outputs.code_impacting }}
        B2B_TRIGGER: ${{ needs.change_detection.outputs.b2b }}
        B2B_REQUIRED: ${{ needs.change_detection.outputs.b2b_required }}
        MARKET_TRIGGER: ${{ needs.change_detection.outputs.market }}
        MARKET_SUITE_REQUIRED: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.change_detection.outputs.market == 'true') }}
        AUDIT_DOCS_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'audit') }}
        TESTNET_SIMULATION_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'simulation') }}
        REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
        GATEWAY_SUITE_RESULT: ${{ needs.gateway-suite.result }}
        B2B_SUITE_RESULT: ${{ needs.b2b-suite.result }}
        LIB_CORE_SUITE_RESULT: ${{ needs.lib-conxian-core-suite.result }}
        B2C_WALLET_SUITE_RESULT: ${{ needs.b2c-wallet-suite.result }}
        AUDIT_DOCS_RESULT: ${{ needs.audit-and-docs.result }}
        TESTNET_SIMULATION_RESULT: ${{ needs.testnet-simulation.result }}
        MARKET_SUITE_RESULT: ${{ needs.market-suite.result }}
      run: |
        python3 scripts/ci/ci_summary_gate.py
