name: Conxian Unified CI

on:
  push:
    branches: [main, staged, dev]
  pull_request:
    branches: [main, staged, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build control plane
        run: pnpm --filter @conxian/control-plane build
      - name: Test control-plane runtime boundary
        run: pnpm --filter @conxian/control-plane test
      - name: Build control-plane container
        run: docker build --tag conxian-control-plane:ci .
      - name: Verify control-plane container HTTP boundary
        run: |
          docker run --detach --name control-plane-ci --publish 127.0.0.1:18080:18080 \
            --env PORT=18080 \
            --env BETTER_AUTH_URL=https://control-plane.invalid \
            --env BETTER_AUTH_SECRET=ci-fixture-only-never-use-in-a-deployment \
            conxian-control-plane:ci
          trap 'docker stop control-plane-ci >/dev/null' EXIT
          python3 - <<'PY'
          import re
          import time
          import urllib.request

          origin = "http://127.0.0.1:18080"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(origin + "/sign-in", timeout=2) as response:
                      html = response.read().decode()
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          assets = re.findall(r'(?:src|href)="([^"?]+\.(?:css|js))(?:\?[^" ]*)?"', html)
          assets = [asset for asset in assets if asset.startswith("/_next/static/")]
          assert assets, "No static assets in sign-in response"
          for asset in assets:
              with urllib.request.urlopen(origin + asset, timeout=5) as response:
                  assert response.status == 200
                  assert response.read(1), "Empty static asset"
          with urllib.request.urlopen(origin + "/api/auth/get-session", timeout=5) as response:
              assert response.status == 200
              assert response.read().strip() == b"null", "Unexpected anonymous session"
          PY
          test "$(docker inspect --format '{{.Config.User}}' control-plane-ci)" = node
      - name: Container logs on failure
        if: failure()
        run: docker logs control-plane-ci 2>/dev/null || true
