name: Conxian Unified CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  monolith-ci:
    name: Full Protocol Suite (Monolith)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gateway & B2B Suite
      run: |
        cd conxian-gateway && cargo check -p api && cargo test
        cd ../conxian-nexus && cargo test

    - name: B2C Wallet Suite
      run: |
        cd conxius-wallet
        npm install
        npm test

    - name: Transparency Audit & Docs
      run: |
        python3 conxian-business/transparency_custodian.py
        make docs-build
        grep -oP '(?<=\]\().*?\.md(?=\))' SUMMARY.md | while read -r link; do
          if [ ! -f "$link" ]; then
            echo "ERROR: Broken link in SUMMARY.md -> $link"
          fi
        done

    - name: Testnet Simulation
      run: |
        pip install -r stacksorbit/requirements.txt
        python3 stacksorbit/conxian_testnet_deploy.py --help
